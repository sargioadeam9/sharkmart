<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OShoppingBD — Frontend Preview</title>
<meta name="description" content="OShoppingBD multi-category e-commerce — frontend design preview">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#C51F4B;--red-d:#a3163c;--pink:#F7DCE4;--navy:#253858;--white:#fff;--bg:#fbf8f9;--line:#eee5e8;--muted:#667590;--ok:#1f8a5b;--r:14px;--sh:0 6px 24px rgba(37,56,88,.08);--sh2:0 14px 40px rgba(37,56,88,.16);--font:'Plus Jakarta Sans','Hind Siliguri',system-ui,sans-serif;--gap:16px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);color:var(--navy);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.bn{font-family:'Hind Siliguri','Plus Jakarta Sans',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img,svg{display:block;max-width:100%}
ul{list-style:none}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--red);color:#fff;padding:8px 14px;border-radius:8px;z-index:999}
.skip:focus{left:8px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* preview strip */
.pv{background:#111b2e;color:#cfd8ea;font-size:12px}
.pv .wrap{display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap;padding-top:7px;padding-bottom:7px}
.pv b{color:#fff;letter-spacing:.04em;text-transform:uppercase;font-size:11px}
.pv a,.pv button{padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.09);color:#fff;font-size:12px}
.pv a:hover,.pv button:hover{background:var(--red)}

/* top bar */
.topbar{background:var(--navy);color:#e8edf6;font-size:12.5px}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;height:36px;gap:12px}
.topbar nav{display:flex;gap:18px;align-items:center}
.topbar a:hover{color:#fff;text-decoration:underline}
.lang{display:inline-flex;background:rgba(255,255,255,.12);border-radius:99px;padding:2px}
.lang button{padding:2px 12px;border-radius:99px;font-size:12px;color:#dfe6f3}
.lang button.on{background:#fff;color:var(--navy);font-weight:700}

/* header */
header.hd{background:#fff;position:sticky;top:0;z-index:60;box-shadow:0 1px 0 var(--line)}
.hd-main{display:flex;align-items:center;gap:22px;height:76px}
.logo{display:flex;align-items:center;gap:9px;flex:none}
.logo .mk{width:40px;height:40px;border-radius:12px;background:var(--red);display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;box-shadow:0 4px 12px rgba(197,31,75,.35)}
.logo .wm{font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--navy)}
.logo .wm i{font-style:normal;color:var(--red)}
.search{flex:1;position:relative;max-width:640px}
.search form{display:flex;border:2px solid var(--pink);border-radius:99px;background:#fff;overflow:hidden;transition:.2s}
.search form:focus-within{border-color:var(--red);box-shadow:0 0 0 4px rgba(197,31,75,.1)}
.search input{flex:1;border:0;outline:0;padding:12px 18px;font:inherit;font-size:14.5px;min-width:0;background:transparent;color:var(--navy)}
.search button.go{background:var(--red);color:#fff;padding:0 22px;font-weight:700;transition:.2s}
.search button.go:hover{background:var(--red-d)}
.sug{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;border-radius:16px;box-shadow:var(--sh2);padding:8px;display:none;z-index:70;max-height:70vh;overflow:auto}
.sug.open{display:block}
.sug h6{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 10px 4px}
.sug a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:14px}
.sug a:hover,.sug a:focus{background:var(--pink)}
.sug .th{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:20px;flex:none}
.sug small{color:var(--muted);margin-left:auto;font-weight:600}
.hd-act{display:flex;align-items:center;gap:6px;margin-left:auto}
.ib{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 12px;border-radius:12px;font-size:11.5px;font-weight:600;color:var(--navy);transition:.15s}
.ib:hover{background:var(--pink)}
.ib svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cnt{position:absolute;top:0;right:6px;min-width:19px;height:19px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.cnt.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.5)}60%{transform:scale(.9)}100%{transform:scale(1)}}

/* nav */
.hd-nav{border-top:1px solid var(--line);position:relative}
.hd-nav .wrap{display:flex;align-items:center;gap:6px;height:50px}
.allcat{display:flex;align-items:center;gap:8px;background:var(--red);color:#fff;padding:0 18px;height:38px;border-radius:99px;font-weight:700;font-size:14px;flex:none}
.allcat:hover{background:var(--red-d)}
.nl{display:flex;gap:2px;margin-left:8px}
.nl>li{position:relative}
.nl>li>a,.nl>li>button{display:block;padding:9px 14px;font-weight:600;font-size:14px;border-radius:99px;transition:.15s;white-space:nowrap}
.nl>li>a:hover,.nl>li>button:hover,.nl>li>a.cur{background:var(--pink);color:var(--red)}
.nl .fs{color:var(--red)}
.more-m{position:absolute;top:100%;left:0;background:#fff;border-radius:14px;box-shadow:var(--sh2);padding:8px;min-width:200px;display:none;z-index:70}
.nl>li:hover .more-m,.nl>li:focus-within .more-m{display:block}
.more-m a{display:block;padding:9px 14px;border-radius:9px;font-size:14px;font-weight:500}
.more-m a:hover{background:var(--pink);color:var(--red)}
.mega{position:absolute;left:0;right:0;top:100%;background:#fff;box-shadow:var(--sh2);display:none;z-index:65;border-top:1px solid var(--line)}
.mega.open{display:block}
.mega .in{display:grid;grid-template-columns:300px 1fr;max-width:1320px;margin:0 auto;padding:0 20px;min-height:380px}
.mega ul{border-right:1px solid var(--line);padding:14px 14px 14px 0;max-height:480px;overflow:auto}
.mega li a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;font-weight:600;font-size:14px}
.mega li a .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:17px}
.mega li a:hover,.mega li a.on{background:var(--pink)}
.mega .pn{padding:22px 28px}
.mega .pn h3{font-size:20px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.mega .sg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 24px}
.mega .sg a{padding:7px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.mega .sg a:hover{color:var(--red)}
.mega .ft{margin-top:20px;border-radius:14px;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.mega .ft b{font-size:18px}

/* hero */
.hero{position:relative;border-radius:22px;overflow:hidden;margin-top:18px;background:var(--pink)}
.h-track{display:flex;transition:transform .7s cubic-bezier(.6,.05,.2,1)}
.h-sl{flex:0 0 100%;min-height:380px;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;padding:0 64px;gap:20px;color:#fff;position:relative;overflow:hidden}
.h-sl::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:rgba(255,255,255,.1);right:-120px;top:-140px}
.h-sl::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.08);right:240px;bottom:-160px}
.h-sl .tx{position:relative;z-index:2}
.h-sl .tg{display:inline-block;background:rgba(255,255,255,.2);padding:5px 14px;border-radius:99px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.h-sl h2{font-size:clamp(30px,4.2vw,54px);line-height:1.08;letter-spacing:-.02em;font-weight:800;margin-bottom:12px}
body.bn .h-sl h2{line-height:1.25}
.h-sl p{font-size:17px;opacity:.92;margin-bottom:24px;max-width:460px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:99px;font-weight:700;font-size:15px;transition:.2s;background:#fff;color:var(--navy)}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.18)}
.btn.red{background:var(--red);color:#fff}
.btn.red:hover{background:var(--red-d)}
.btn.line{background:transparent;border:2px solid var(--red);color:var(--red)}
.h-sl .art{position:relative;z-index:2;display:flex;justify-content:center;gap:10px;font-size:clamp(70px,9vw,128px);filter:drop-shadow(0 18px 24px rgba(0,0,0,.25))}
.h-sl .art span:nth-child(2){transform:translateY(-22px) scale(1.15)}
.h-ar{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--navy);font-size:22px;display:grid;place-items:center;z-index:5;box-shadow:var(--sh);transition:.2s}
.h-ar:hover{background:#fff;transform:translateY(-50%) scale(1.08)}
.h-ar.p{left:14px}.h-ar.n{right:14px}
.h-dots{position:absolute;left:0;right:0;bottom:14px;display:flex;gap:8px;justify-content:center;z-index:5}
.h-dots button{width:9px;height:9px;border-radius:99px;background:rgba(255,255,255,.55);transition:.3s}
.h-dots button.on{width:28px;background:#fff}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 6px}
.trust div{display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.trust .ti{width:42px;height:42px;border-radius:12px;background:var(--pink);display:grid;place-items:center;font-size:20px;flex:none}
.trust b{display:block;font-size:14px}.trust small{color:var(--muted);font-size:12.5px}

/* sections */
.sec{margin-top:44px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px}
.sh h2{font-size:clamp(21px,2.4vw,28px);letter-spacing:-.02em;font-weight:800;display:flex;align-items:center;gap:10px}
.sh h2::before{content:"";width:6px;height:26px;border-radius:4px;background:var(--red)}
.sh p{color:var(--muted);font-size:14px;margin-top:2px}
.sh a.va{color:var(--red);font-weight:700;font-size:14px;white-space:nowrap}
.sh a.va:hover{text-decoration:underline}

/* carousel */
.car{position:relative}
.car-track{display:flex;gap:var(--gap);overflow-x:auto;scrollbar-width:none;padding:6px 2px 14px;margin:-6px -2px -14px;cursor:grab;-webkit-overflow-scrolling:touch}
.car-track::-webkit-scrollbar{display:none}
.car-track.drag{cursor:grabbing;user-select:none}
.car-track.drag a{pointer-events:none}
.car-track>*{flex:0 0 var(--w)}
.per-prod{--per:5}.per-brand{--per:6}.per-cat{--per:7}.per-ext{--per:7}
.car{--w:calc((100% - var(--gap)*(var(--per) - 1))/var(--per))}
.car.per-mini .car-track>*{flex:0 0 148px}
.car-btn{position:absolute;top:42%;width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:var(--sh2);display:grid;place-items:center;font-size:22px;z-index:4;transition:.2s;color:var(--navy)}
.car-btn:hover{background:var(--red);color:#fff}
.car-btn.prev{left:-14px}.car-btn.next{right:-14px}
.car.noscroll .car-btn{display:none}
.car.per-mini .car-btn{width:30px;height:30px;font-size:17px;top:38%}
.car.per-mini .car-btn.prev{left:-6px}.car.per-mini .car-btn.next{right:-6px}

/* brand tiles */
.bt{background:#fff;border-radius:18px;padding:18px 14px;text-align:center;box-shadow:var(--sh);border:2px solid transparent;transition:.25s;display:block;height:100%}
.bt:hover{transform:translateY(-4px);border-color:var(--bc);box-shadow:var(--sh2)}
.bt .lg{height:62px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:17px;letter-spacing:-.01em;color:#fff;background:var(--bc);margin-bottom:10px;position:relative;overflow:hidden}
.bt .lg::after{content:"";position:absolute;right:-18px;top:-18px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.18)}
.bt b{display:block;font-size:14px}
.bt small{display:block;color:var(--muted);font-size:12px;margin-top:2px;line-height:1.35}
.ex{background:#fff;border-radius:16px;padding:0 10px;height:84px;display:grid;place-items:center;box-shadow:var(--sh);font-weight:800;font-size:19px;letter-spacing:.03em;color:#51607c;border:2px solid transparent;transition:.2s;width:100%}
.ex:hover{border-color:var(--pink);color:var(--red);transform:translateY(-3px)}

/* flash */
.flash{background:linear-gradient(120deg,var(--red),#e0476e);border-radius:24px;padding:26px 26px 30px;color:#fff;position:relative;overflow:hidden}
.flash::before{content:"⚡";position:absolute;right:-10px;top:-40px;font-size:200px;opacity:.12}
.flash .sh h2{color:#fff}.flash .sh h2::before{background:#fff}
.flash .sh a.va{color:#fff}
.cd{display:flex;gap:8px;align-items:center;font-weight:700}
.cd span{background:#fff;color:var(--red);border-radius:10px;min-width:46px;text-align:center;padding:5px 6px;font-size:20px;font-weight:800;line-height:1.1}
.cd span small{display:block;font-size:9.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cd i{font-style:normal;font-size:20px}
.fl-h{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.sold{height:7px;border-radius:9px;background:#f0e3e7;margin:8px 0 2px;overflow:hidden}
.sold i{display:block;height:100%;background:linear-gradient(90deg,#f5a623,var(--red));border-radius:9px}
.sold-t{font-size:11.5px;color:var(--muted);font-weight:600}

/* product card */
.pc{background:#fff;border-radius:18px;position:relative;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;height:100%;transition:.25s;border:1px solid transparent}
.pc:hover{box-shadow:var(--sh2);transform:translateY(-3px);border-color:var(--pink)}
.pc-img{display:grid;place-items:center;aspect-ratio:1/1;background:radial-gradient(circle at 50% 42%,#fff 0 28%,var(--t) 29% 100%);position:relative;overflow:hidden}
.pc-img .emo{font-size:clamp(56px,6vw,84px);transition:transform .35s;filter:drop-shadow(0 10px 10px rgba(37,56,88,.18))}
.pc:hover .emo{transform:scale(1.12) rotate(-4deg)}
.badge{position:absolute;left:10px;top:10px;background:var(--red);color:#fff;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px}
.oos{position:absolute;inset:auto 0 0 0;background:rgba(37,56,88,.82);color:#fff;text-align:center;font-size:12px;font-weight:700;padding:5px}
.wish{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);display:grid;place-items:center;font-size:17px;color:#b8c0d0;transition:.2s;z-index:2}
.wish:hover{color:var(--red);transform:scale(1.12)}
.wish.on{color:var(--red);background:var(--pink)}
.qv{position:absolute;left:10px;right:10px;top:calc(100% - 0px);transform:translateY(0);background:rgba(255,255,255,.96);border-radius:10px;padding:7px;font-size:12.5px;font-weight:700;color:var(--navy);opacity:0;transition:.25s;z-index:2;box-shadow:var(--sh);top:calc((100% - 0px)*0 + 0px);top:auto}
.pc .qv{position:absolute;bottom:auto;top:calc(var(--pw,0px));display:none}
@media(hover:hover){.pc:hover .qv{display:block;opacity:1}}
.pc-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
.pc-brand{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.pc-n{font-weight:600;font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.pc-n:hover{color:var(--red)}
.pc-r{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.stars{background:linear-gradient(90deg,#f5a623 var(--r),#d9dde6 var(--r));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px;font-size:13px}
.pc-p{display:flex;align-items:baseline;gap:8px}
.pc-p b{font-size:17px;color:var(--red);font-weight:800}
.pc-p s{font-size:12.5px;color:#98a2b8}
.pc-s{font-size:12px;font-weight:600;color:var(--ok)}
.pc-s.low{color:#c27a00}.pc-s.out{color:var(--red)}
.btn-add{margin-top:auto;padding:9px 12px;border-radius:11px;border:1.5px solid rgba(197,31,75,.55);background:#fff;color:var(--navy);font-weight:700;font-size:13.5px;transition:.2s;display:flex;align-items:center;justify-content:center;gap:7px;position:relative}
.pc-b .btn-add{margin-top:8px}
.btn-add:hover{background:var(--pink);border-color:var(--red)}
.btn-add:active{transform:scale(.97)}
.btn-add:disabled{opacity:.5;cursor:not-allowed;background:#f4f4f6;border-color:#ddd}
.btn-add.ld{pointer-events:none;color:transparent}
.btn-add.ld::after{content:"";position:absolute;width:18px;height:18px;border:2.5px solid var(--pink);border-top-color:var(--red);border-radius:50%;animation:sp .6s linear infinite}
.btn-add.ok{background:var(--ok);border-color:var(--ok);color:#fff}
@keyframes sp{to{transform:rotate(360deg)}}

/* categories */
.cc{display:block;background:#fff;border-radius:20px;padding:20px 10px 16px;text-align:center;box-shadow:var(--sh);border-bottom:4px solid var(--a);transition:.25s;height:100%}
.cc:hover{transform:translateY(-5px);box-shadow:var(--sh2)}
.cc .ci{width:74px;height:74px;border-radius:50%;margin:0 auto 10px;background:var(--t);display:grid;place-items:center;font-size:36px;box-shadow:inset 0 0 0 3px #fff,0 0 0 2px var(--a)}
.cc b{font-size:13.5px;line-height:1.25;display:block}
.cc small{color:var(--muted);font-size:11.5px}

/* promo banners */
.pb{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pb a{border-radius:22px;padding:26px;min-height:190px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;background:var(--t);border:2px solid var(--a);transition:.25s}
.pb a:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
.pb a .big{position:absolute;right:10px;bottom:-10px;font-size:110px;opacity:.9;filter:drop-shadow(0 10px 10px rgba(0,0,0,.12))}
.pb small{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--navy);opacity:.7}
.pb h3{font-size:24px;line-height:1.15;margin:6px 0 12px;max-width:70%;letter-spacing:-.01em}
.pb span.cta{background:var(--navy);color:#fff;padding:7px 16px;border-radius:99px;font-size:13px;font-weight:700;width:max-content}

/* newsletter */
.nlw{background:var(--navy);color:#fff;border-radius:26px;padding:42px;display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center;position:relative;overflow:hidden}
.nlw::after{content:"✉️";position:absolute;right:30px;top:-30px;font-size:180px;opacity:.07}
.nlw h2{font-size:30px;line-height:1.15;letter-spacing:-.02em}
.nlw p{opacity:.8;margin-top:8px}
.nlw form{display:flex;gap:8px;background:#fff;border-radius:99px;padding:5px;position:relative;z-index:2}
.nlw input{flex:1;border:0;outline:0;padding:0 16px;font:inherit;background:transparent;color:var(--navy);min-width:0}

/* footer */
footer{background:#fff;margin-top:56px;border-top:1px solid var(--line);padding:46px 0 0}
.fg{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1.2fr;gap:30px}
.fg h4{font-size:15px;margin-bottom:12px}
.fg li{margin:7px 0;font-size:14px;color:#4d5d7a}
.fg li a:hover{color:var(--red)}
.fg p{font-size:14px;color:#4d5d7a;margin:12px 0}
.pay{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pay span{border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;color:#51607c;background:#fff}
.copy{border-top:1px solid var(--line);margin-top:34px;padding:16px 0;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* drawer */
.ov{position:fixed;inset:0;background:rgba(17,27,46,.55);opacity:0;pointer-events:none;transition:.3s;z-index:100;backdrop-filter:blur(2px)}
.ov.open{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;background:#fff;z-index:110;transform:translateX(105%);transition:transform .38s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.2)}
#drawer.open{transform:none}
.dr-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.dr-h h3{font-size:20px;display:flex;align-items:center;gap:10px}
.dr-h h3 em{font-style:normal;background:var(--pink);color:var(--red);font-size:13px;padding:2px 10px;border-radius:99px}
.x{width:38px;height:38px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:20px;transition:.2s}
.x:hover{background:var(--pink);color:var(--red);transform:rotate(90deg)}
.dr-b{flex:1;overflow:auto;padding:6px 20px 12px}
.ship{background:var(--pink);border-radius:12px;padding:10px 14px;font-size:13px;margin:12px 0 4px}
.ship .bar{height:6px;background:#fff;border-radius:9px;margin-top:7px;overflow:hidden}
.ship .bar i{display:block;height:100%;background:var(--red);border-radius:9px;transition:width .4s}
.ci-row{display:grid;grid-template-columns:72px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);animation:fi .3s}
@keyframes fi{from{opacity:0;transform:translateX(14px)}}
.ci-row .im{width:72px;height:72px;border-radius:14px;display:grid;place-items:center;font-size:36px}
.ci-row h5{font-size:14px;font-weight:600;line-height:1.3}
.ci-row .vr{font-size:12px;color:var(--muted)}
.ci-row .up{font-size:13px;color:var(--red);font-weight:700;margin-top:2px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:99px;margin-top:6px;overflow:hidden}
.qty button{width:30px;height:30px;font-size:17px;font-weight:700;transition:.15s}
.qty button:hover{background:var(--pink);color:var(--red)}
.qty span{min-width:30px;text-align:center;font-weight:700;font-size:14px}
.qty span.pop{animation:bump .4s}
.ci-row .rt{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between}
.ci-row .rt b{font-size:15px}
.rm{font-size:12px;color:var(--muted);text-decoration:underline;transition:.15s}
.rm:hover{color:var(--red)}
.rel{margin-top:20px}
.rel h4{font-size:15px;margin-bottom:10px}
.mini{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:3px;height:100%}
.mini .im{aspect-ratio:1.35;border-radius:10px;display:grid;place-items:center;font-size:34px;position:relative}
.mini .im s{position:absolute}
.mini b.n{font-size:12.5px;line-height:1.25;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.mini .pr{font-size:13px;font-weight:800;color:var(--red)}
.mini .pr s{font-size:11px;color:#98a2b8;font-weight:500;margin-left:4px}
.mini .btn-add{padding:6px;font-size:12px;border-radius:9px}
.dr-f{border-top:1px solid var(--line);padding:14px 20px 18px;background:#fff;box-shadow:0 -8px 20px rgba(37,56,88,.05)}
.row{display:flex;justify-content:space-between;font-size:14px;margin:5px 0;color:#4d5d7a}
.row.disc b{color:var(--ok)}
.row.tot{font-size:18px;color:var(--navy);font-weight:800;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.dr-f .btn{width:100%;margin-top:10px}
.dr-f .btn.line{padding:10px}
.empty{text-align:center;padding:50px 10px;color:var(--muted)}

/* breadcrumbs, listing */
.bc{font-size:13px;color:var(--muted);padding:16px 0 4px;display:flex;gap:8px;flex-wrap:wrap}
.bc a:hover{color:var(--red)}
.bc b{color:var(--navy);font-weight:600}
.chero{border-radius:24px;padding:36px 44px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;background:linear-gradient(110deg,var(--t) 40%,color-mix(in srgb,var(--a) 55%,#fff));border:2px solid var(--a);position:relative;overflow:hidden;min-height:230px}
.chero .ib2{width:84px;height:84px;border-radius:24px;background:#fff;display:grid;place-items:center;font-size:44px;box-shadow:0 0 0 3px var(--a);margin-bottom:12px}
.chero h1{font-size:clamp(28px,3.6vw,44px);letter-spacing:-.02em;line-height:1.1}
.chero p{max-width:520px;margin-top:8px;color:#3d4d6b}
.chero .big{font-size:clamp(100px,14vw,190px);filter:drop-shadow(0 18px 18px rgba(0,0,0,.15));transform:rotate(-6deg)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.chip{padding:8px 16px;border-radius:99px;background:#fff;border:1.5px solid var(--a,var(--line));font-size:13.5px;font-weight:600;transition:.15s}
.chip:hover,.chip.on{background:var(--a,var(--red));color:var(--navy)}
.offers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.offers div{background:var(--t);border:1.5px dashed var(--a);border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:center}
.offers .oe{font-size:30px}
.offers b{display:block}.offers small{color:#4d5d7a}
.lay{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:start}
.flt{background:#fff;border-radius:18px;padding:18px;box-shadow:var(--sh);position:sticky;top:150px}
.flt h4{font-size:15px;margin:14px 0 8px}
.flt h4:first-child{margin-top:0}
.flt label{display:flex;align-items:center;gap:9px;font-size:14px;margin:6px 0;cursor:pointer}
.flt input[type=checkbox],.flt input[type=radio]{accent-color:var(--red);width:16px;height:16px}
.flt input[type=range]{width:100%;accent-color:var(--red)}
.tb{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.tb select,.sel{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:9px 16px;font:inherit;font-size:14px;color:var(--navy);outline:0}
.tb select:focus,.sel:focus{border-color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.lay .grid{grid-template-columns:repeat(3,1fr)}
.fbtn{display:none}
.lm{text-align:center;margin-top:26px}
.nores{text-align:center;padding:50px 20px;background:#fff;border-radius:20px}
.nores .e{font-size:70px}

/* product page */
.pp{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;margin-top:10px}
.gal{display:grid;grid-template-columns:78px 1fr;gap:14px;align-self:start;position:sticky;top:150px}
.thumbs{display:flex;flex-direction:column;gap:10px}
.thumbs button{width:78px;height:78px;border-radius:14px;border:2px solid var(--line);display:grid;place-items:center;font-size:36px;background:#fff;transition:.15s;position:relative;overflow:hidden}
.thumbs button.on,.thumbs button:hover{border-color:var(--red)}
.gm{border-radius:24px;aspect-ratio:1/1;display:grid;place-items:center;position:relative;overflow:hidden;cursor:zoom-in;box-shadow:var(--sh);background:#fff}
.gm .z{font-size:clamp(150px,20vw,270px);transition:transform .25s;filter:drop-shadow(0 22px 20px rgba(37,56,88,.22));will-change:transform}
.gm .tools{position:absolute;right:14px;bottom:14px;display:flex;gap:8px;z-index:2}
.gm .tools button{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:var(--sh);font-size:17px;font-weight:700}
.gm .tools button:hover{background:var(--pink)}
.gm .lbl{position:absolute;left:14px;bottom:16px;background:rgba(255,255,255,.9);padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700}
.vid{margin-top:14px;border-radius:18px;overflow:hidden;background:#111b2e;color:#fff;display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer;transition:.2s}

.vid small{opacity:.7;display:block;font-size:12.5px}
.pi .br{font-size:13px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.07em}
.pi h1{font-size:clamp(24px,2.8vw,34px);line-height:1.2;letter-spacing:-.02em;margin:4px 0 8px}
body.bn .pi h1{line-height:1.35}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);align-items:center}
.meta .sku{background:#fff;border:1px solid var(--line);border-radius:8px;padding:2px 10px}
.price{display:flex;align-items:baseline;gap:12px;margin:16px 0 4px;flex-wrap:wrap}
.price b{font-size:34px;color:var(--red);font-weight:800;letter-spacing:-.02em}
.price s{color:#98a2b8;font-size:18px}
.price em{font-style:normal;background:var(--red);color:#fff;font-size:13px;font-weight:800;padding:3px 11px;border-radius:99px}
.stk{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px;color:var(--ok)}
.stk::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.stk.low{color:#c27a00}.stk.out{color:var(--red)}
.vg{margin:18px 0}
.vg h5{font-size:14px;margin-bottom:8px}
.vg h5 span{color:var(--muted);font-weight:500}
.vo{display:flex;gap:8px;flex-wrap:wrap}
.vo button{min-width:52px;padding:9px 16px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:600;font-size:14px;transition:.15s;position:relative}
.vo button:hover{border-color:var(--navy)}
.vo button.on{border-color:var(--red);background:var(--pink);color:var(--red)}
.vo button:disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through;background:#f3f3f6}
.vo.col button{width:40px;height:40px;min-width:0;padding:0;border-radius:50%;border-width:3px;box-shadow:inset 0 0 0 3px #fff}
.vo.col button.on{border-color:var(--red)}
.acts{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:20px 0}
.acts .qty{margin:0;border-width:2px}
.acts .qty button{width:42px;height:44px}
.acts .btn{flex:1;min-width:150px;padding:14px 20px}
.btn.addl{background:#fff;border:2px solid var(--red);color:var(--navy)}
.btn.addl:hover{background:var(--pink)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.sq{display:flex;gap:8px;flex-wrap:wrap}
.sq button{display:flex;gap:7px;align-items:center;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;transition:.15s}
.sq button:hover{background:var(--pink);border-color:var(--red)}
.sq button.on{color:var(--red)}
.box{background:#fff;border-radius:18px;padding:18px;margin-top:16px;box-shadow:var(--sh)}
.box h4{font-size:15px;margin-bottom:10px}
.dl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dl .res{flex:1 1 100%;font-size:13.5px;color:#3d4d6b;background:var(--bg);border-radius:10px;padding:10px 12px}
.cp{display:flex;gap:8px;flex-wrap:wrap}
.cp span{border:1.5px dashed var(--red);color:var(--red);background:#fff7f9;padding:5px 12px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer}
.cp span small{color:var(--navy);font-weight:500;margin-left:6px}
.pol{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.pol div{background:#fff;border-radius:14px;padding:12px;text-align:center;font-size:12.5px;box-shadow:var(--sh)}
.pol i{font-style:normal;font-size:22px;display:block}
.tabs{margin-top:44px;background:#fff;border-radius:22px;box-shadow:var(--sh);overflow:hidden}
.tabs .tl{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;padding:0 10px}
.tabs .tl::-webkit-scrollbar{display:none}
.tabs .tl button{padding:16px 18px;font-weight:700;font-size:14.5px;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;transition:.15s}
.tabs .tl button.on{color:var(--red);border-color:var(--red)}
.tabs .tc{padding:26px 30px;font-size:15px;color:#3d4d6b;line-height:1.7}
.tabs .tc ul{list-style:disc;padding-left:22px}
.tabs .tc li{margin:4px 0}
.spec{display:grid;grid-template-columns:200px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.spec>*{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.spec>b{background:var(--bg)}
.spec>*:nth-last-child(-n+2){border-bottom:0}
.faq details{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px}
.faq summary{font-weight:700;cursor:pointer}
.rv{display:grid;grid-template-columns:300px 1fr;gap:34px}
.rv .sum{text-align:center}
.rv .sum .big{font-size:56px;font-weight:800;line-height:1}
.bars{margin-top:14px;text-align:left}
.bars button{display:grid;grid-template-columns:28px 1fr 38px;gap:8px;align-items:center;width:100%;font-size:13px;margin:6px 0;border-radius:6px}
.bars button:hover b{background:#f5c3d0}
.bars b{height:9px;background:#f0e6e9;border-radius:9px;overflow:hidden;display:block}
.bars b i{display:block;height:100%;background:#f5a623;border-radius:9px}
.rl{display:flex;flex-direction:column;gap:14px}
.rv-c{border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.rv-c .t{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.av{width:36px;height:36px;border-radius:50%;background:var(--pink);color:var(--red);display:grid;place-items:center;font-weight:800}
.vb{font-size:11.5px;background:#e3f5ec;color:var(--ok);padding:2px 9px;border-radius:99px;font-weight:700}
.rv-c .ft{display:flex;gap:16px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.rv-c .ft button:hover{color:var(--red)}
.fbt{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;border-radius:20px;padding:18px;box-shadow:var(--sh)}
.fbt .it{width:110px;text-align:center;font-size:13px}
.fbt .it .im{aspect-ratio:1;border-radius:16px;display:grid;place-items:center;font-size:48px;margin-bottom:4px}
.fbt .pl{font-size:26px;color:var(--muted);font-weight:300}
.fbt .sm{margin-left:auto;text-align:right}
.fbt .sm b{font-size:24px;color:var(--red);display:block}

/* modal */
.mo{position:fixed;inset:0;z-index:130;display:none;place-items:center;padding:16px}
.mo.open{display:grid}
.mo .bg{position:absolute;inset:0;background:rgba(17,27,46,.65)}
.mo .cd2{position:relative;background:#fff;border-radius:24px;max-width:860px;width:100%;max-height:90vh;overflow:auto;padding:26px;animation:pp .3s}
@keyframes pp{from{opacity:0;transform:scale(.94)}}
.mo .cd2 .x{position:absolute;right:14px;top:14px;z-index:3}
.qvg{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}
.qvg .im{aspect-ratio:1;border-radius:20px;display:grid;place-items:center;font-size:150px}
.lb{background:rgba(10,16,30,.94)!important}
.lbx{font-size:min(60vw,340px);filter:drop-shadow(0 30px 30px rgba(0,0,0,.4));z-index:2;position:relative;text-align:center;line-height:1}
.lbn{position:absolute;top:50%;width:52px;height:52px;border-radius:50%;background:#fff;font-size:26px;z-index:3;transform:translateY(-50%)}
.lbn.p{left:20px}.lbn.n{right:20px}
.lbc{position:absolute;right:20px;top:20px;z-index:3;background:#fff;width:46px;height:46px;border-radius:50%;font-size:22px}

/* floating */
.fl{position:fixed;right:18px;bottom:24px;z-index:80;display:flex;flex-direction:column;gap:12px;align-items:flex-end}
.fl .f{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.25);position:relative;transition:.2s}
.fl .f:hover{transform:scale(1.08)}
.fl .fc{background:var(--red);color:#fff}
.fl .fc svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fl .fc .cnt{border-color:var(--red);background:#fff;color:var(--red);top:-2px;right:-2px}
.fl .fm{background:var(--navy);color:#fff;font-size:26px}
.sup{display:none;flex-direction:column;gap:8px;background:#fff;border-radius:18px;padding:10px;box-shadow:var(--sh2);width:230px}
.sup.open{display:flex;animation:pp .25s}
.sup a{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;font-weight:600;font-size:14px}
.sup a:hover{background:var(--pink)}
.sup a i{font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;color:#fff}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,40px);background:var(--navy);color:#fff;padding:12px 22px;border-radius:99px;font-weight:600;font-size:14px;z-index:200;opacity:0;pointer-events:none;transition:.3s;display:flex;gap:10px;align-items:center;box-shadow:var(--sh2);max-width:92vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{font-style:normal;background:var(--ok);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none}

/* mobile */
.mhd,.bnav,.msheet{display:none}
@media(max-width:1200px){.per-prod{--per:4}.per-brand{--per:5}.per-cat{--per:6}.per-ext{--per:5}.grid{grid-template-columns:repeat(3,1fr)}.fg{grid-template-columns:repeat(3,1fr)}.nl>li>a,.nl>li>button{padding:9px 10px}}

 .per-prod{--per:2.15}.per-brand{--per:3.2}.per-cat{--per:3.3}.per-ext{--per:3.2}

const IO=new IntersectionObserver(es=>es.forEach(e=>e.target._vis=e.isIntersecting),{threshold:.1});
function initCars(root=document){$$('[data-car]',root).forEach(el=>{if(el._i)return;el._i=1;const tr=$('.car-track',el);let fp=0,dir=1,hov=false,hold=false,rt=null;const auto=el.dataset.auto!=='0'&&!RM;
const mx=()=>tr.scrollWidth-tr.clientWidth;const chk=()=>el.classList.toggle('noscroll',mx()<=4);chk();addEventListener('resize',chk);
IO.observe(el);const pause=ms=>{hold=true;clearTimeout(rt);rt=setTimeout(()=>{hold=false;fp=tr.scrollLeft},ms)};
el.addEventListener('mouseenter',()=>hov=true);el.addEventListener('mouseleave',()=>{hov=false;fp=tr.scrollLeft});
el.addEventListener('focusin',()=>hov=true);el.addEventListener('focusout',()=>{hov=false});
tr.addEventListener('touchstart',()=>pause(3500),{passive:true});tr.addEventListener('wheel',()=>pause(2500),{passive:true});
$('.prev',el).onclick=()=>{pause(3500);tr.scrollBy({left:-tr.clientWidth*.8,behavior:RM?'auto':'smooth'})};$('.next',el).onclick=()=>{pause(3500);tr.scrollBy({left:tr.clientWidth*.8,behavior:RM?'auto':'smooth'})};
let down=false,sx=0,sl=0,mv=0;tr.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;down=true;sx=e.clientX;sl=tr.scrollLeft;mv=0;pause(3500)});
addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx;mv=Math.max(mv,Math.abs(dx));if(mv>5)tr.classList.add('drag');tr.scrollLeft=sl-dx});
addEventListener('pointerup',()=>{if(down){down=false;setTimeout(()=>tr.classList.remove('drag'),0)}});
if(auto){const tick=()=>{if(!el.isConnected)return;if(el._vis&&!hov&&!hold&&!down&&mx()>4){if(Math.abs(tr.scrollLeft-fp)>2)fp=tr.scrollLeft;fp+=dir*.5;if(fp>=mx()){fp=mx();dir=-1}if(fp<=0){fp=0;dir=1}tr.scrollLeft=fp}requestAnimationFrame(tick)};requestAnimationFrame(tick)}})}

if(x=T('[data-lang]')){st.lang=x.dataset.lang;document.documentElement.lang=st.lang==='bn'?'bn':'en';document.body.classList.toggle('bn',st.lang==='bn');chrome();route();if($('#drawer').classList.contains('open'))renderDrawer();initCars(document);return}
if(x=T('[data-add]')){e.preventDefault();addCart(+x.dataset.add,1,'',0,x);return}
if(T('[data-open-cart]')){openCart();return}
if(T('[data-close-cart]')||e.target===$('#ov')){closeAll();return}
if(x=T('[data-cq]')){const [id,v,d]=x.dataset.cq.split('|'),it=st.cart.find(i=>cartKey(i)===id+'|'+v);if(it){it.q+=+d;if(it.q<1)st.cart=st.cart.filter(i=>i!==it);updCounts();renderDrawer(true);const s=$$('.qty span')[0]}return}
if(x=T('[data-rm]')){st.cart=st.cart.filter(i=>cartKey(i)!==x.dataset.rm);updCounts();renderDrawer(true);return}
if(x=T('[data-wish]')){e.preventDefault();const id=+x.dataset.wish;if(st.wish.has(id)){st.wish.delete(id);toast(t('wRem'))}else{st.wish.add(id);toast(t('wAdded'))}$$(`[data-wish="${id}"]`).forEach(b=>{b.classList.toggle('on',st.wish.has(id));b.setAttribute('aria-pressed',st.wish.has(id))});updCounts();return}
if(x=T('[data-qv]')){qv(+x.dataset.qv);return}
if(x=T('[data-toast]')){e.preventDefault();toast(x.dataset.toast);return}
if(T('[data-close]')||T('.cd2>.x')){closeAll();return}
if(T('[data-sheet]')){$('#msheet').classList.add('open');$('#ov').classList.add('open');return}
if(T('[data-sheet-close]')){closeAll();return}
if(T('[data-msearch]')){const i=$('.mhd [data-q]');scrollTo(0,0);i&&i.focus();return}
if(T('#allcat')){const m=$('#mega'),o=m.classList.toggle('open');$('#allcat').setAttribute('aria-expanded',o);return}
else if(!T('#mega'))$('#mega')&&$('#mega').classList.remove('open');
if(T('#fm')){const s=$('#sup');const o=s.classList.toggle('open');$('#fm').setAttribute('aria-expanded',o);return}
if(T('[data-flt-open]')){$('#flt').classList.add('open');return}if(T('[data-flt-close]')){$('#flt').classList.remove('open');return}
/* product page */
if(x=T('[data-vo]')){const [g,o]=x.dataset.vo.split('|');PS.sel[+g]=+o;pUpd();return}
if(x=T('[data-pq]')){PS.qty=Math.max(1,Math.min(10,PS.qty+ +x.dataset.pq));$('#pq').textContent=nf(PS.qty);return}
if(x=T('#p-add')||T('#p-buy')){const c=pCur(),v=PS.vars.map((g,i)=>g.o[PS.sel[i]].n).join(' / ');addCart(PS.id,PS.qty,v,c.price-c.p.p,x.id==='p-add'?x:null);if(x.id==='p-buy')openCart();return}
if(x=T('[data-img]')){PS.img=+x.dataset.img;drawGal();return}
if(T('[data-zin]')){PS.zoom=Math.min(2.5,(PS.zoom||1)+.4);$('#gz').style.transform=`${$('#gz').dataset.base} scale(${PS.zoom})`;return}
if(T('[data-zout]')){PS.zoom=Math.max(1,(PS.zoom||1)-.4);$('#gz').style.transform=`${$('#gz').dataset.base} scale(${PS.zoom})`;return}
if(T('[data-lb]')||(T('#gm')&&!T('.tools'))){lb();return}
if(T('[data-video]')){toast(st.lang==='bn'?'ভিডিও প্লেয়ার (ডেমো)':'Video player (demo). Never autoplays.');return}
if(x=T('[data-tab]')){$$('[data-tab]').forEach(b=>b.classList.toggle('on',b===x));$('#tc').innerHTML=PS.tabs[+x.dataset.tab][1];return}
if(x=T('[data-rf]')){PS.rf=+x.dataset.rf;pRev();return}
if(x=T('[data-addall]')){x.dataset.addall.split(',').forEach(id=>addCart(+id,1));openCart();return}
if(T('[data-copy]')){try{navigator.clipboard.writeText(location.href)}catch(_){}toast(t('copied'));return}
if(T('[data-share]')){try{navigator.share?navigator.share({url:location.href}):toast(t('copied'))}catch(_){}return}
if(T('.sug a'))$$('[data-sug]').forEach(s=>s.classList.remove('open'));
if(!T('.search'))$$('[data-sug]').forEach(s=>s.classList.remove('open'))});
document.addEventListener('mouseover',e=>{const a=e.target.closest('[data-mc]');if(a)mega(+a.dataset.mc)});
document.addEventListener('change',e=>{if(e.target.id==='dist'){const v=e.target.value;$('#dres').textContent=v?(()=>{const [c,d]=v.split('|');return `${t('ship')}: ${fmt(+c)} · ${d}`})():t('inc')}if(e.target.id==='rs')pRev()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeAll();$('#mega')&&$('#mega').classList.remove('open')}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-video]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{if(!e.target.matches('[data-q]'))return;const q=e.target.value.trim().toLowerCase(),box=e.target.closest('.search').querySelector('[data-sug]');if(!q){box.classList.remove('open');return}
const ps=P.filter(p=>[p.en,p.bn,p.b,p.sku].join(' ').toLowerCase().includes(q)).slice(0,5),cs=CATS.filter(c=>(c.en+c.bn).toLowerCase().includes(q)).slice(0,3),bs=[...OWN.map(b=>b.n),...EXT].filter(b=>b.toLowerCase().includes(q)).slice(0,3);
box.innerHTML=(cs.length?`<h6>${t('catg')}</h6>`+cs.map(c=>`<a href="#/category/${c.id}"><span class="th" style="background:${c.t}">${c.e}</span>${cn(c)}</a>`).join(''):'')+(bs.length?`<h6>${t('brand')}</h6>`+bs.map(b=>`<a href="#/search/${encodeURIComponent(b)}"><span class="th" style="background:var(--pink)">🏷️</span>${b}</a>`).join(''):'')+(ps.length?`<h6>${st.lang==='bn'?'পণ্য':'Products'}</h6>`+ps.map(p=>`<a href="#/product/${p.id}"><span class="th" style="background:${C(p).t}">${p.e}</span>${nm(p)}<small>${fmt(p.p)}</small></a>`).join(''):`<h6>${t('nores')}</h6>`);box.classList.add('open')});
document.addEventListener('submit',e=>{const f=e.target;if(f.matches('[data-search]')){e.preventDefault();const q=$('[data-q]',f).value.trim();if(q){location.hash='#/search/'+encodeURIComponent(q);$$('[data-sug]').forEach(s=>s.classList.remove('open'))}}if(f.matches('[data-news]')){e.preventDefault();toast(st.lang==='bn'?'সাবস্ক্রাইব করার জন্য ধন্যবাদ!':'Thanks for subscribing!');f.reset()}});
function qv(id){const p=P[id-1],c=C(p),[k,tx]=stockT(p);$('#mob').innerHTML=`<button class="x" aria-label="Close">✕</button><div class="qvg"><div class="im" style="background:radial-gradient(circle at 50% 45%,#fff 0 24%,${c.t} 25% 100%)">${p.e}</div><div><div style="color:var(--red);font-weight:700;font-size:13px;text-transform:uppercase">${p.b}</div><h2 style="font-size:26px;margin:4px 0 8px">${nm(p)}</h2><div class="meta">${stars(p.r)} ${nf(p.r)} (${nf(p.rv)})</div><div class="price"><b>${fmt(p.p)}</b>${p.d?`<s>${fmt(p.o)}</s><em>-${nf(p.d)}%</em>`:''}</div><div class="stk ${k}">${tx}</div><div class="acts" style="position:static;box-shadow:none;margin:18px 0;padding:0"><button class="btn addl" data-add="${p.id}" ${p.stock<=0?'disabled':''}>${t('add')}</button><a class="btn red" href="#/product/${p.id}">${t('viewD')}</a></div></div></div>`;$('#mo').classList.add('open')}
function lb(){const p=P[PS.id-1];let i=PS.img;const draw=()=>{$('#mob').innerHTML=`<button class="lbc" aria-label="Close" data-close>✕</button><button class="lbn p" aria-label="Prev">‹</button><div class="lbx" style="transform:${ANG[i][1]}">${p.e}</div><button class="lbn n" aria-label="Next">›</button>`;$('.lbn.p').onclick=ev=>{ev.stopPropagation();i=(i+4)%5;draw()};$('.lbn.n').onclick=ev=>{ev.stopPropagation();i=(i+1)%5;draw()}};
$('#mo').classList.add('lbm');$('#mob').classList.add('lb');$('#mob').style.cssText='background:transparent;box-shadow:none;max-width:none;width:100%;height:100%;display:grid;place-items:center;overflow:hidden';$('#mo .bg').classList.add('lb');draw();$('#mo').classList.add('open');
const obs=new MutationObserver(()=>{if(!$('#mo').classList.contains('open')){$('#mob').classList.remove('lb');$('#mob').style.cssText='';$('#mo .bg').classList.remove('lb');obs.disconnect()}});obs.observe($('#mo'),{attributes:true,attributeFilter:['class']})}

/* boot */
st.cart=[{id:4,q:1,v:'M / Black',d:0},{id:50,q:2,v:'',d:0}];
chrome();route();updCounts();
</script>
</body>
</html>
